name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        # The suite runs without audio hardware or GPU; only the numeric audio
        # helpers (clap detector, mixer) need numpy and soundfile.
        run: python -m pip install -e . numpy==1.26.4 soundfile==0.12.1

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources and tests
        run: python -m compileall -q src tests
