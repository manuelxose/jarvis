jarvis:
  name: "Jarvis"
  user_name: "Manuel"
  language: "es"

wake_word:
  openwakeword_enabled: false
  model: "hey_jarvis"
  threshold: 0.04
  cooldown_seconds: 1.2
  hard_trigger_hits: 1
  soft_trigger_hits: 2
  soft_trigger_ratio: 0.6
  voice_rms_for_soft_trigger: 25
  score_log_interval_seconds: 4
  stt_fallback_enabled: true
  stt_fallback_max_record_seconds: 3.0
  stt_fallback_probe_interval_seconds: 1.0
  continuous_listen_when_disabled: true
  continuous_require_keyword: true

stt:
  model: "tiny"
  device: "cpu"
  compute_type: "int8"
  language: "es"
  initial_prompt: "Ey Jarvis"
  no_speech_threshold: 0.75
  log_prob_threshold: -1.2
  temperature: 0.0
  silence_duration: 0.6
  min_speech_duration: 0.3
  max_record_seconds: 4
  vad_mode: 1
  whisper_vad_filter: true
  whisper_beam_size: 1

llm:
  base_url: "http://localhost:11434"
  model: "mistral:7b-instruct"
  temperature: 0.7
  timeout: 30
  max_history_messages: 10

tts:
  model: "tts_models/multilingual/multi-dataset/xtts_v2"
  language: "es"
  speaker_wav_dir: "voice_samples/"
  cache_enabled: true
  auto_accept_cpml: true

audio:
  sample_rate: 16000
  channels: 1
  chunk_size: 1024
  auto_select_input: false
  input_device: 5
  output_device: null

ais:
  enabled: true
  host: "localhost"
  port: 10110
  search_radius_km: 50

trading:
  enabled: true
  mt4_log_path: "C:/Users/Manuel/AppData/Roaming/MetaQuotes/Terminal"
