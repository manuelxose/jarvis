[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "2.0.0"
description = "Local-first Spanish voice assistant for Windows"
requires-python = ">=3.11,<3.12"
dependencies = []

[project.scripts]
jarvis = "jarvis.apps.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
